# Production shape of the stack. Local development layers
# docker-compose.dev.yml on top of this (see the Makefile).
#
# Only `web` and `api` are published; postgres, redis and the worker stay
# internal to the compose network.

name: zug-tracker

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zug}
      POSTGRES_DB: ${POSTGRES_DB:-zug}
    volumes:
      # Postgres 18+ images expect the mount here, not at .../postgresql/data:
      # the data itself lives in a major-version subdirectory below it.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zug} -d ${POSTGRES_DB:-zug}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8-trixie
    # No volume on purpose: Redis only holds transient realtime state.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: prod
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zug:zug@postgres:5432/zug}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200
          else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the api, different command.
    build:
      context: ./apps/api
      target: prod
    command: ["python", "-m", "app.worker.main"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zug:zug@postgres:5432/zug}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-10}
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:-}
      GTFS_REALTIME_URL: ${GTFS_REALTIME_URL:-}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
