# Production shape of the stack, and what Coolify deploys (docs/deploy.md).
# Local development layers docker-compose.dev.yml on top of this, and `make up`
# layers docker-compose.local.yml (see the Makefile).
#
# No ports are published here: a reverse proxy (Coolify's, in production)
# routes a domain to `web` and one to `api`. postgres, redis and the worker
# stay internal to the compose network.

# One connection string, built from the POSTGRES_* values, so a deployment sets
# its password once. Use a URL-safe password (letters and digits).
x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-zug}:${POSTGRES_PASSWORD:-zug}@postgres:5432/${POSTGRES_DB:-zug}

name: zug-tracker

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zug}
      POSTGRES_DB: ${POSTGRES_DB:-zug}
    volumes:
      # Postgres 18+ images expect the mount here, not at .../postgresql/data:
      # the data itself lives in a major-version subdirectory below it.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zug} -d ${POSTGRES_DB:-zug}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8-trixie
    # No volume on purpose: Redis only holds transient realtime state.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Applies database migrations, then exits. The api and the worker start only
  # once it has succeeded, so every deploy migrates before serving. Seeing it
  # as "exited (0)" is expected.
  migrate:
    build:
      context: ./apps/api
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: prod
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database-url
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      # The API reports the active dataset on /api/v1/health.
      GTFS_FEED_ID: ${GTFS_FEED_ID:-fv_free}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200
          else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the api, different command.
    build:
      context: ./apps/api
      target: prod
    command: ["python", "-m", "app.worker.main"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database-url
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      # Public and keyless. Without it the worker imports nothing and the map
      # stays empty, so it defaults to the feed rather than to nothing.
      GTFS_STATIC_URL: ${GTFS_STATIC_URL:-https://download.gtfs.de/germany/fv_free/latest.zip}
      # Deliberately empty by default: polling it costs ~75 GB/day of ingress
      # from Phase 6 on, which a host should opt into.
      GTFS_REALTIME_URL: ${GTFS_REALTIME_URL:-}
      GTFS_FEED_ID: ${GTFS_FEED_ID:-fv_free}
      GTFS_DATASET_RETENTION: ${GTFS_DATASET_RETENTION:-1}
      # The worker re-imports the timetable on this cadence; without it the
      # feed expires after 31 days and the map empties.
      GTFS_REFRESH_INTERVAL_SECONDS: ${GTFS_REFRESH_INTERVAL_SECONDS:-86400}
      GTFS_REFRESH_RETRY_SECONDS: ${GTFS_REFRESH_RETRY_SECONDS:-900}
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: prod
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      # The image has no curl; Node's fetch does the same job.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
