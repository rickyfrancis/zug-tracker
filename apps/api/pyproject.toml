[project]
name = "zug-api"
version = "0.1.0"
description = "zug-tracker backend: FastAPI application and background worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "testcontainers[postgres]>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    # Needs a real PostGIS container. Composite foreign keys, the partial unique
    # index, COPY and the atomic swap have no meaningful fake - see ADR-0002.
    # Run the rest with: pytest -m "not db"
    "db: requires a PostgreSQL container via testcontainers",
]
